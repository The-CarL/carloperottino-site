<path d="M260 230 L360 230" stroke="#c9a86c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M620 230 L720 230" stroke="#c9a86c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M490 350 L490 280" stroke="#c9a86c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="180" width="220" height="100" rx="8" fill="#111111" stroke="#66563b"/>
