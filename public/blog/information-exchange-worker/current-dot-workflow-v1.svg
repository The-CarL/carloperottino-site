<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Current · dot + Spaces</title><desc id="desc">A dot uses context in Spaces and risk guidance to handle incoming email, Slack and Teams exchanges. Scheduled or proactive operation is shown as a workflow option.</desc>
