<text x="150.0" y="248.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Incoming questions</text>
<rect x="360" y="180" width="260" height="100" rx="8" fill="#111111" stroke="#66563b"/>
<text x="490.0" y="223.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f0ece6">dot</text>
<text x="490.0" y="248.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Scheduled / proactive</text>
<rect x="720" y="180" width="240" height="100" rx="8" fill="#111111" stroke="#66563b"/>
<text x="840.0" y="223.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f0ece6">Respond or bring</text>
<text x="840.0" y="248.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">a decision to me</text>
