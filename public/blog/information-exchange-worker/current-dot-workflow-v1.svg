<text x="490.0" y="418.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Notes + risk guidance</text>
<text x="40" y="525" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Same exchange, with the context layer in Spaces. Simplified personal workflow.</text></svg>