<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Future · connected personal context</title><desc id="desc">An agent consults a personal knowledge graph connecting customers, people, projects and interactions. The graph references original emails, chats, transcripts and files rather than storing all their contents.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a86c"/></marker></defs>
<rect width="1000" height="560" rx="12" fill="#0a0a0a"/>
<text x="40" y="53" fill="#c9a86c" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="600">Future · connected personal context</text>
<path d="M240 240 L340 240" stroke="#c9a86c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M560 240 L660 240" stroke="#c9a86c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M810 290 L810 370" stroke="#c9a86c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="810.0" y="320.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#c9a86c">References</text>
<rect x="40" y="190" width="200" height="100" rx="8" fill="#111111" stroke="#66563b"/>
<text x="140.0" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f0ece6">Incoming question</text>
<text x="140.0" y="258.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Any connected channel</text>
<rect x="340" y="190" width="220" height="100" rx="8" fill="#111111" stroke="#66563b"/>
<text x="450.0" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f0ece6">Agent</text>
<text x="450.0" y="258.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Find relevant context</text>
<rect x="660" y="190" width="300" height="100" rx="8" fill="#111111" stroke="#66563b"/>
<text x="810.0" y="233.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f0ece6">Personal knowledge graph</text>
<text x="810.0" y="258.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">People · customers · projects</text>
<rect x="660" y="370" width="300" height="100" rx="8" fill="#111111" stroke="#66563b"/>
<text x="810.0" y="413.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#f0ece6">Original sources</text>
<text x="810.0" y="438.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">Emails · chats · calls · files</text>
<text x="40" y="525" font-family="Inter,Arial,sans-serif" font-size="16" fill="#bfb8ac">The graph links shared entities and points to sources; it does not contain every document.</text></svg>