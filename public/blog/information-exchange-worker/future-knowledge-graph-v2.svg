<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">FUTURE  /  one connected context layer</title><desc id="desc">An entity graph links interactions to their original sources instead of copying every document into the graph.</desc>
